syntax="proto3";

import "greeter.proto";
option go_package = "/proto/gen;mainapipb";

service Calculate {
  rpc add(AddRequest) returns(AddResponse);
}

service Greeter {
  rpc helloNamaste(GreeterRequest) returns(GreeterResponse);
}

message AddRequest {
  int32 a = 1;
  int32 b = 2;

}

message AddResponse {
  int64  sum = 1;
}